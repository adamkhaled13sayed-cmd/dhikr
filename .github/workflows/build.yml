name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: unzip -q ./*.zip
      - run: cd DhikrGate && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DhikrGate-APK
          path: DhikrGate/app/build/outputs/apk/debug/app-debug.apk
